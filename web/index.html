<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marooned — island walk</title>
  </head>
  <body class="gate">
    <div id="hud-world" aria-hidden="true">
      <div id="hud-weather" data-sky="sun"></div>
      <time id="hud-clock">08:00</time>
    </div>
    <div id="hud-needs" aria-hidden="true"></div>
    <div id="hint">Click or press a key to hear the island. WASD walk. SHIFT run. Space interact. 1 / 2 pockets. 0 empty hands. G drop.</div>
    <div id="gear">
      <button type="button" class="gear-slot" data-slot="hands">
        <span class="gear-label">Hands (0)</span>
        <span class="gear-item" id="gear-hands-item">Empty</span>
      </button>
      <button type="button" class="gear-slot" data-slot="left">
        <span class="gear-label">Left pocket (1)</span>
        <span class="gear-item" id="gear-left-item">Empty</span>
      </button>
      <button type="button" class="gear-slot" data-slot="right">
        <span class="gear-label">Right pocket (2)</span>
        <span class="gear-item" id="gear-right-item">Empty</span>
      </button>
    </div>
    <div id="interact" hidden>
      <div id="interact-name"></div>
      <button type="button" id="interact-action" hidden></button>
    </div>
    <div id="character">
      <div class="character-card">
        <p id="character-death" hidden></p>
        <h1 id="character-title">Marooned</h1>
        <p class="character-lead">Who washes up?</p>
        <label class="character-field" style="display: none;">
          <span>Name</span>
          <span class="character-name-row">
            <input id="character-name" type="text" maxlength="24" autocomplete="nickname" />
            <button type="button" id="character-name-roll" title="Another name">↻</button>
          </span>
        </label>
        <div class="character-field">
          <span>Look</span>
          <div id="character-gender" class="character-toggle">
            <button type="button" data-gender="male">Male</button>
            <button type="button" data-gender="female">Female</button>
          </div>
        </div>
        <div class="character-field">
          <span>Skin</span>
          <div id="character-skin" class="swatches"></div>
        </div>
        <div class="character-field">
          <span>Clothes</span>
          <div id="character-clothes" class="swatches"></div>
        </div>
        <div class="character-actions">
          <button type="button" id="character-play">Choose character</button>
          <button type="button" id="character-random">Random character</button>
        </div>
      </div>
    </div>
    <div id="death" hidden>
      <p id="death-message"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
